    // app script further down has even started downloading its (large, network-fetched) ES module
    // dependencies. That module script cannot execute a single line, including its own
    // getUserMedia() call, until those imports resolve, so acquiring the camera here instead means
    // the permission prompt / hardware warm-up starts milliseconds after the link is opened rather
    // than after Firebase has loaded.

        low:    { width: 480,  height: 360, frameRate: 15, maxBitrate: 350000,  audioSampleRate: 24000 },

        high:   { width: 1280, height: 720, frameRate: 24, maxBitrate: 3000000, audioSampleRate: 48000 }

        var score = 0;

    function playConnectBeep() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain.gain.linearRampToValueAtTime(0.0001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {}
    }

    function playBuzzTone() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        for (let i = 0; i < 3; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.0001, now + i * 0.35);
          gain.gain.exponentialRampToValueAtTime(0.3, now + i * 0.35 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.35 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.35);
          osc.stop(now + i * 0.35 + 0.3);
        }
      } catch (e) {}
    }

    function processSignal(change) {
      if (change.type === 'added') {
        const data = change.doc.data();
        const sender = data.sender;
        
        if (sender === myUid) return;

        if (data.type === 'cut') {
          endCall(false); 
          deleteDoc(doc(db, 'family_signals', change.doc.id)).catch(() => {});
          return;
        }

        const payload = data.payload ? JSON.parse(data.payload) : null;
        deleteDoc(doc(db, 'family_signals', change.doc.id)).catch(() => {});

        try {
          if (data.type === 'offer') {
            const pc = createPeer(sender);
            pc.setRemoteDescription(new RTCSessionDescription(payload)).then(() => {
              processQueuedCandidates(sender, pc);
              return pc.createAnswer();
            }).then(answer => {
              pc.setLocalDescription(answer);
              addDoc(collection(db, 'family_signals'), { sender: myUid, receiver: sender, type: 'answer', payload: JSON.stringify(answer) });
            });
          } else if (data.type === 'answer') {
            const pc = peers[sender];
            if (pc) {
              pc.setRemoteDescription(new RTCSessionDescription(payload)).then(() => processQueuedCandidates(sender, pc));
            }
          } else if (data.type === 'candidate') {
            const pc = peers[sender];
            const candidate = new RTCIceCandidate(payload);
            if (pc && pc.remoteDescription) pc.addIceCandidate(candidate);
            else {
              candidateQueues[sender] = candidateQueues[sender] || [];
              candidateQueues[sender].push(candidate);
            }
          }
        } catch (e) {}
      }
    }

              initiateCall(uid);
            }
          }
        });
      });
    }

    async function initiateCall(targetUid) {
      const pc = createPeer(targetUid);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await addDoc(collection(db, 'family_signals'), { sender: myUid, receiver: targetUid, type: 'offer', payload: JSON.stringify(offer) });
    }

    async function subscribeToPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (!GLITCH_WORKER_URL || !VAPID_PUBLIC_KEY || GLITCH_WORKER_URL.includes('YOUR-GLITCH-PROJECT')) return;
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;
        const registration = await navigator.serviceWorker.ready;
        let sub = await registration.pushManager.getSubscription();
        if (!sub) {
          sub = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
        }
        await setDoc(doc(db, 'family_push_subscriptions', myUid), { subscription: JSON.stringify(sub.toJSON()), name: myName, updatedAt: Date.now() });
      } catch (e) {}
    }

    async function relayPushBuzz(targetUid) {
      if (!GLITCH_WORKER_URL || !VAPID_PUBLIC_KEY || GLITCH_WORKER_URL.includes('YOUR-GLITCH-PROJECT')) return;
      try {
        let targetDocs = [];
        if (targetUid === 'all') {
          const snap = await getDocs(query(collection(db, 'family_push_subscriptions')));
          snap.forEach(d => { if (d.id !== myUid) targetDocs.push(d.data().subscription) });
        } else {
          const docSnap = await getDoc(doc(db, 'family_push_subscriptions', targetUid));
          if (docSnap.exists()) targetDocs.push(docSnap.data().subscription);
        }
        for (const subStr of targetDocs) {
          await fetch(GLITCH_WORKER_URL + '/buzz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subscription: JSON.parse(subStr), senderName: myName })
          });
        }
      } catch (e) {}
    }

    // Auto-initialize when the app loads
            window.addEventListener('DOMContentLoaded', async () => {
              try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        
              // 1. Reuse the camera/mic request already fired from the inline <head> script before
              // Firebase even finished loading, instead of starting a brand new getUserMedia call here.
              // Falls back to firing it fresh only if that early script somehow didn't run.
              if (window.__earlyProfile) {
                currentTier = window.__earlyTier;
                currentProfile = window.__earlyProfile;
              } else {
                detectDeviceTier();
              }
              const mediaPromise = window.__earlyMediaPromise || navigator.mediaDevices.getUserMedia({ video: { width: { ideal: currentProfile.width }, height: { ideal: currentProfile.height }, frameRate: { ideal: currentProfile.frameRate, max: currentProfile.frameRate } }, audio: { echoCancellation: true, noiseSuppression: true, sampleRate: currentProfile.audioSampleRate } })
                .catch(() => navigator.mediaDevices.getUserMedia({ video: false, audio: { echoCancellation: true, noiseSuppression: true, sampleRate: currentProfile.audioSampleRate } }))
                .catch(() => null);
        
              // 2. The moment the stream is ready, show it. This is its own branch so it is never gated
              // on the Firestore ID lookup below - a slow or cold Firestore connection can no longer
              // delay when the camera appears.
              const mediaReadyPromise = (async () => {
                const mediaResult = await mediaPromise;
                if (mediaResult) {
                  localStream = mediaResult;
                  hasMedia = true;
                  if (localStream.getVideoTracks().length > 0) {
                    localVideo.srcObject = localStream;
                  }
                } else {
                  hasMedia = false;
                }
        
                // Refine the quality tier in the background using the real screen refresh rate, without
                // having delayed camera acquisition above for it.
                refineDeviceTierInBackground();
        
                if (localStream) {
                  localStream.getTracks().forEach(t => t.enabled = true);
                  isCommsLive = true;
                } else {
                  isCommsLive = false;
                }
        
                setupKeepAliveAudio();
                updateMediaState();
                updateVideoGrid(); // Init local scale
              })();
        
              // 3. Fetch current users to determine the next ID - runs fully in parallel with the
              // camera branch above; neither one waits on the other.
              const idPromise = getDocs(collection(db, 'family_presence')).then((presenceSnap) => {
                let maxId = 0;
                const now = Date.now();
                
                presenceSnap.forEach((docSnap) => {
                  const data = docSnap.data();
                  if (data.online && (now - data.lastSeen < 60000) && data.name) {
                    const num = parseInt(data.name);
                    if (!isNaN(num) && num > maxId) {
                      maxId = num;
                    }
                  }
                });
                
                const nextIdNumber = maxId + 1;
                myName = String(nextIdNumber).padStart(3, '0');
                localStorage.setItem('myName', myName);
                myIdInput.value = myName;
        
              }).catch((error) => {
                console.error("Failed to assign ID, defaulting to 001", error);
                myName = "001"; 
                myIdInput.value = myName;
              });
        
              // 4. Register Presence and enter channel once both branches above have settled - video
              // display already happened without waiting for this.
              await Promise.all([mediaReadyPromise, idPromise]);
    
          try {
        await setDoc(doc(db, 'family_presence', myUid), {
          name: myName,
          online: true,
          speaking: isCommsLive,
          hasMic: hasMedia,
          lastSeen: Date.now()
        });
        hasJoined = true;
                
                setInterval(() => {
                    if (hasJoined) setDoc(doc(db, 'family_presence', myUid), { lastSeen: Date.now() }, { merge: true }).catch(()=>{});
                }, 45000);
        
                subscribeToPush();
                listenForSignals();
                listenForPresence();
                listenForBuzzes();
                startAdaptiveMonitor();

        const markOffline = () => {
                  setDoc(doc(db, 'family_presence', myUid), { name: myName, online: false, speaking: false }, { merge: true }).catch(() => {});
                };
                window.addEventListener('beforeunload', markOffline);
                window.addEventListener('pagehide', markOffline);
        
        if(isCommsLive) {
           cutCallBtn.style.display = 'block';
           acceptCallBtn.style.display = 'none';
        }
        
      } catch (e) {
        statusText.textContent = "UPLINK FAILED. RETRY.";
      }
    });
  </script>
